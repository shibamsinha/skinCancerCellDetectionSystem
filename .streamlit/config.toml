[theme]
base = "light"
primaryColor = "#1f6fc5"
backgroundColor = "#f5f7fa"
secondaryBackgroundColor = "#ffffff"
textColor = "#14202e"
font = "sans serif"
baseRadius = "0.6rem"
showSidebarBorder = true

[server]
# No `address` here: hosting platforms (e.g. Streamlit Community Cloud) manage the network binding.
# For a local-only run, start the app with `--server.address localhost` (see README).
maxUploadSize = 20          # MB; matches skincancer.preprocessing.image_loader.MAX_UPLOAD_BYTES
runOnSave = false

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
